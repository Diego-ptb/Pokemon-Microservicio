# =====================================================================
# Orquestación con Docker Compose (IE5) y entorno de despliegue simulado (IE4)
#
#   cliente ──► gateway (Nginx, balanceador) ──► app x N réplicas ──► db (PostgreSQL)
#               red "frontend"                    red "backend" (interna, sin salida)
#
# Uso local:
#   cp .env.example .env            # y define POSTGRES_PASSWORD
#   docker compose up -d --build --wait
#   docker compose up -d --scale app=3 --wait    # escalar horizontalmente
#
# En el pipeline se usa la imagen ya publicada en GHCR (APP_IMAGE=...:sha-xxxxxxx)
# con "docker compose up --no-build", así se despliega exactamente lo que se probó.
# =====================================================================
name: pokemon

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ------------------------------------------------------------------
  # Base de datos
  # ------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pokemon}
      POSTGRES_USER: ${POSTGRES_USER:-pokemon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Se ejecuta solo la primera vez (volumen vacío): crea la tabla y carga datos
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    logging: *default-logging

  # ------------------------------------------------------------------
  # Microservicio (escalable: varias réplicas detrás del gateway)
  # ------------------------------------------------------------------
  app:
    image: ${APP_IMAGE:-pokemon-service:local}
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-local}
        APP_VERSION: ${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pokemon}
      DB_USERNAME: ${POSTGRES_USER:-pokemon}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      DEPLOY_ENV: ${DEPLOY_ENV:-local}
      # Logs menos verbosos fuera de desarrollo
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      LOG_LEVEL_SQL: ${LOG_LEVEL_SQL:-INFO}
      # Pool de conexiones acotado: N réplicas x 10 conexiones < max_connections (100) de Postgres
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_SIZE:-10}
    depends_on:
      db:
        condition: service_healthy
    # Sin "ports": la app NO se publica al host, solo se accede vía gateway
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - backend
    # Endurecimiento del contenedor
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    deploy:
      replicas: ${APP_REPLICAS:-2}
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 384M
    logging: *default-logging

  # ------------------------------------------------------------------
  # Gateway / balanceador de carga (único punto de entrada)
  # ------------------------------------------------------------------
  gateway:
    image: nginxinc/nginx-unprivileged:1.31-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging: *default-logging

networks:
  frontend:
  backend:
    # Red interna: db y app no tienen salida a Internet ni puertos expuestos
    internal: true

volumes:
  db-data:
