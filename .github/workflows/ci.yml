name: Java 21 Spring Boot CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Compilar y Ejecutar Pruebas
    runs-on: ubuntu-latest

    steps:
      # 1. Clona el código en la máquina virtual de GitHub
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Prepara el entorno Java 21 con caché de dependencias
      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
         java-version: '21'
         distribution: 'temurin'
         cache: 'maven'

      # 3. Compila y ejecuta los tests unitarios
      - name: Compilar y Ejecutar Pruebas con Maven
        run: mvn clean test
