# =====================================================================
# Pipeline CI/CD — pokemon-service
#
#  push / PR ─► 1. Build + pruebas (JUnit + JaCoCo ≥ 80%)          [IE2]
#            ─► 2. Análisis de código SonarCloud (quality gate)     [IE3]
#            ─► 3. Revisión de dependencias (solo PR)               [IE3]
#                     │  (si cualquiera falla, el pipeline se detiene)
#                     ▼
#               4. Imagen Docker: lint + build + escaneo Grype       [IE1][IE3]
#                  + publicación en GHCR con tag del commit         [IE4]
#                     ▼
#               5. Despliegue automático (Docker Compose) + smoke    [IE4][IE5]
#                  develop ─► staging      main ─► production
# =====================================================================
name: CI/CD Pokemon Service

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Mínimo privilegio por defecto; cada job pide solo lo que necesita
permissions:
  contents: read

# En PR se cancela la ejecución anterior; en main/develop nunca se corta un despliegue
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: temurin

jobs:
  # -------------------------------------------------------------------
  # 1. Compilación y pruebas unitarias con política de cobertura
  # -------------------------------------------------------------------
  build-test:
    name: 1 · Build y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Instalar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      # verify = compila + ejecuta JUnit + genera reporte JaCoCo + jacoco:check
      # (falla si la cobertura de líneas baja del mínimo definido en pom.xml)
      - name: Compilar, probar y verificar cobertura
        run: mvn -B -ntp verify

      - name: Resumen de pruebas y cobertura
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv, glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for path in glob.glob("target/surefire-reports/TEST-*.xml"):
              r = ET.parse(path).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          print("## Pruebas unitarias")
          print(f"| Total | Exitosas | Fallidas | Errores | Omitidas |\n|---|---|---|---|---|")
          print(f"| {t} | {t-f-e-s} | {f} | {e} | {s} |")
          try:
              rows = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
              lm = sum(int(r["LINE_MISSED"]) for r in rows); lc = sum(int(r["LINE_COVERED"]) for r in rows)
              bm = sum(int(r["BRANCH_MISSED"]) for r in rows); bc = sum(int(r["BRANCH_COVERED"]) for r in rows)
              print("\n## Cobertura (JaCoCo)")
              print(f"- Líneas: **{100*lc/max(lc+lm,1):.1f}%** (mínimo exigido: 80%)")
              print(f"- Ramas: **{100*bc/max(bc+bm,1):.1f}%**")
          except FileNotFoundError:
              print("\n_No se generó reporte de cobertura._")
          EOF

      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 30

      - name: Publicar JAR compilado (artefacto trazable al commit)
        uses: actions/upload-artifact@v7
        with:
          name: pokemon-service-jar-${{ github.sha }}
          path: target/*.jar
          retention-days: 30

  # -------------------------------------------------------------------
  # 2. Análisis estático de código y seguridad con SonarCloud
  #    -Dsonar.qualitygate.wait=true hace que el job FALLE si el
  #    Quality Gate no pasa (bugs, vulnerabilidades, hotspots, cobertura)
  # -------------------------------------------------------------------
  sonar:
    name: 2 · Análisis SonarCloud (Quality Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Cuándo se analiza (plan gratuito de SonarCloud: solo rama principal y PRs):
    #  - En cada Pull Request (así todo cambio que entra a develop o main pasa el Quality Gate)
    #  - En cada push a main (estado oficial del proyecto)
    # Los PR desde forks y los de Dependabot no reciben secretos, así que se omiten.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
        github.ref == 'refs/heads/main'
      )
    steps:
      - name: Descargar repositorio (historial completo para Sonar)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verificar configuración de SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          missing=0
          [ -z "$SONAR_TOKEN" ] && echo "::error::Falta el secret SONAR_TOKEN (Settings > Secrets and variables > Actions)" && missing=1
          [ -z "$SONAR_ORGANIZATION" ] && echo "::error::Falta la variable SONAR_ORGANIZATION" && missing=1
          [ -z "$SONAR_PROJECT_KEY" ] && echo "::error::Falta la variable SONAR_PROJECT_KEY" && missing=1
          exit $missing

      - name: Instalar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache de SonarCloud
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      # Los valores se pasan como variables de entorno (no como expresiones dentro
      # del comando) para evitar inyección de comandos en el shell.
      - name: Análisis y espera del Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: >
          mvn -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          "-Dsonar.organization=${SONAR_ORGANIZATION}"
          "-Dsonar.projectKey=${SONAR_PROJECT_KEY}"
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

  # -------------------------------------------------------------------
  # 3. Revisión de dependencias nuevas en Pull Requests
  #    Bloquea el PR si introduce una dependencia con vulnerabilidad alta/crítica
  # -------------------------------------------------------------------
  dependency-review:
    name: 3 · Revisión de dependencias (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: ${{ github.actor == 'dependabot[bot]' && 'never' || 'on-failure' }}

  # -------------------------------------------------------------------
  # 4. Imagen Docker: lint, build, escaneo de vulnerabilidades y publicación
  # -------------------------------------------------------------------
  docker:
    name: 4 · Imagen Docker (build, escaneo, publicación)
    needs: [build-test, sonar]
    # Requiere pruebas OK y Sonar OK. Sonar solo puede omitirse fuera de main
    # (push a develop, cuyo código ya pasó el Quality Gate en su PR, o PRs de Dependabot).
    # En main el Quality Gate es SIEMPRE obligatorio.
    if: >-
      always() &&
      needs.build-test.result == 'success' &&
      (needs.sonar.result == 'success' || (needs.sonar.result == 'skipped' && github.ref != 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # publicar en GitHub Container Registry
      security-events: write   # subir resultados del escaneo a la pestaña Security
    outputs:
      image: ${{ steps.vars.outputs.image }}
      image-ref: ${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.short_sha }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Calcular nombre de imagen y versión
        id: vars
        run: |
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "short_sha=${GITHUB_SHA::7}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Lint del Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.12.0-alpine hadolint --failure-threshold error - < Dockerfile

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generar tags y labels (trazabilidad)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir imagen (local, para escanear antes de publicar)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: pokemon-service:scan
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            APP_VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # BLOQUEO: si la imagen tiene vulnerabilidades CRÍTICAS con parche
      # disponible, el job falla y la imagen NO se publica ni se despliega.
      # Todas las demás (altas, medias...) quedan como alertas en Security.
      - name: Escanear vulnerabilidades de la imagen (Grype)
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: pokemon-service:scan
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: sarif

      # Si el escaneo bloquea, muestra en el log y en el resumen QUÉ vulnerabilidad lo causó
      - name: Detalle de vulnerabilidades que bloquean
        if: failure() && steps.scan.outcome == 'failure'
        env:
          SARIF: ${{ steps.scan.outputs.sarif }}
        run: |
          {
            echo "## Vulnerabilidades críticas con parche disponible"
            jq -r '[.runs[].results[]] as $r | ([$r[] | select(.level == "error")] | if length > 0 then . else $r end)[] | "- **\(.ruleId)**: \(.message.text)"' "$SARIF" | sort -u
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Enviar resultados del escaneo a GitHub Security (alertas)
        if: always() && steps.scan.outputs.sarif != ''
        continue-on-error: true   # requiere repo público o GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-container

      - name: Iniciar sesión en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen en GHCR
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            APP_VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
          cache-from: type=gha
          # SBOM y procedencia: qué contiene la imagen y cómo/dónde se construyó
          sbom: true
          provenance: mode=max

      - name: Resumen de la imagen
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Imagen publicada"
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Imagen | \`${IMAGE}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Tags | $(echo "$TAGS" | sed 's/.*://' | paste -sd ' ' -) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------
  # 5. Despliegue automático en entorno simulado (Docker Compose)
  # -------------------------------------------------------------------
  deploy-staging:
    name: 5 · Deploy staging
    needs: docker
    # always(): sin esto GitHub salta el deploy cuando un job anterior de la
    # cadena fue omitido (p. ej. SonarCloud en develop), aunque la imagen esté OK
    if: always() && needs.docker.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image-ref: ${{ needs.docker.outputs.image-ref }}
      digest: ${{ needs.docker.outputs.digest }}
      replicas: 2

  deploy-production:
    name: 5 · Deploy production
    needs: docker
    # always(): sin esto GitHub salta el deploy cuando un job anterior de la
    # cadena fue omitido (p. ej. SonarCloud en develop), aunque la imagen esté OK
    if: always() && needs.docker.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image-ref: ${{ needs.docker.outputs.image-ref }}
      digest: ${{ needs.docker.outputs.digest }}
      replicas: 3
      use-supabase: true
    secrets:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # -------------------------------------------------------------------
  # 6. Despliegue en AWS EC2 (nube real del laboratorio AWS Academy)
  #    Corre después de que production pasó en el entorno simulado.
  #    Secrets: EC2_HOST (IP pública) y EC2_SSH_KEY (llave privada .pem).
  #    Variable opcional: EC2_USER (por defecto ec2-user; en Ubuntu: ubuntu).
  #    Si los Secrets no existen, el job se omite con un aviso (no falla).
  # -------------------------------------------------------------------
  deploy-ec2:
    name: 6 · Deploy AWS EC2
    needs: [docker, deploy-production]
    if: always() && needs.deploy-production.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    environment:
      name: aws-ec2
    concurrency:
      group: deploy-aws-ec2
      cancel-in-progress: false
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER || 'ec2-user' }}
      APP_IMAGE: ${{ needs.docker.outputs.image-ref }}
      EC2_PORT: "80"
      EC2_REPLICAS: ${{ vars.EC2_APP_REPLICAS || '2' }}
    steps:
      - name: Verificar configuración de EC2
        id: check
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::warning::EC2 no configurado (faltan los secrets EC2_HOST y/o EC2_SSH_KEY): se omite el despliegue en AWS"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "## Deploy AWS EC2 omitido: faltan los secrets EC2_HOST / EC2_SSH_KEY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar configuración de despliegue
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Configurar llave SSH
        if: steps.check.outputs.configured == 'true'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "Host ec2"
            echo "  HostName $EC2_HOST"
            echo "  User $EC2_USER"
            echo "  IdentityFile ~/.ssh/ec2.pem"
            echo "  ServerAliveInterval 30"
          } >> ~/.ssh/config
          ssh ec2 'echo "Conexión SSH OK: $(hostname)"'

      - name: Copiar archivos de despliegue a la instancia
        if: steps.check.outputs.configured == 'true'
        run: |
          ssh ec2 'mkdir -p ~/pokemon/deploy/nginx ~/pokemon/scripts'
          scp docker-compose.yml docker-compose.supabase.yml schema.sql ec2:~/pokemon/
          scp deploy/nginx/default.conf ec2:~/pokemon/deploy/nginx/
          scp scripts/ec2-deploy.sh ec2:~/pokemon/scripts/

      - name: Enviar credenciales de Supabase a la instancia
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Se envían por stdin (no quedan en el log ni en la línea de comandos)
          if [ -n "$SUPABASE_DB_URL" ] && [ -n "$SUPABASE_DB_USER" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            printf 'SUPABASE_DB_URL=%s\nSUPABASE_DB_USER=%s\nSUPABASE_DB_PASSWORD=%s\n' \
              "$SUPABASE_DB_URL" "$SUPABASE_DB_USER" "$SUPABASE_DB_PASSWORD" \
              | ssh ec2 'umask 077; cat > ~/pokemon/.env.supabase'
            echo "DB_MODE=supabase" >> "$GITHUB_ENV"
          else
            echo "::warning::Faltan los secrets de Supabase: la instancia EC2 usará PostgreSQL local"
            ssh ec2 'rm -f ~/pokemon/.env.supabase'
            echo "DB_MODE=local" >> "$GITHUB_ENV"
          fi

      - name: Desplegar en EC2
        if: steps.check.outputs.configured == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Las variables se expanden a propósito en el runner antes de enviarse por SSH.
          # 1) Instala Docker y Compose si la instancia no los tiene
          ssh ec2 'bash ~/pokemon/scripts/ec2-deploy.sh --instalar'
          # 2) Sesión en GHCR para descargar la imagen (el token va por stdin, no queda en el log)
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh ec2 "sudo docker login ghcr.io -u '${GITHUB_ACTOR}' --password-stdin"
          # 3) Despliegue con la imagen exacta que pasó las pruebas y el escaneo
          # shellcheck disable=SC2029
          ssh ec2 "bash ~/pokemon/scripts/ec2-deploy.sh '${APP_IMAGE}' '${GITHUB_SHA}' '${EC2_REPLICAS}' '${EC2_PORT}' '${DB_MODE}'"

      - name: Smoke tests contra la instancia EC2
        if: steps.check.outputs.configured == 'true'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          BASE_URL="http://${EC2_HOST}:${EC2_PORT}" EXPECTED_REPLICAS="$EC2_REPLICAS" bash scripts/smoke-test.sh

      - name: Registro de trazabilidad (EC2)
        if: always() && steps.check.outputs.configured == 'true'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Despliegue en AWS EC2"
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Estado | ${JOB_STATUS} |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Imagen | \`${APP_IMAGE}\` |"
            echo "| Réplicas | ${EC2_REPLICAS} |"
            echo "| Base de datos | ${DB_MODE:-n/a} |"
            echo "| Fecha (UTC) | $(date -u +'%Y-%m-%d %H:%M:%S') |"
          } >> "$GITHUB_STEP_SUMMARY"
          ssh ec2 'cd ~/pokemon && sudo docker compose -f docker-compose.yml $( [ -f .use-supabase ] && echo -f docker-compose.supabase.yml ) ps' || true
