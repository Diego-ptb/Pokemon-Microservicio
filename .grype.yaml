# =====================================================================
# Excepciones del escaneo de vulnerabilidades (Grype) — job 4
#
# Cada excepción es una aceptación de riesgo documentada: se indica por
# qué no aplica al proyecto y cuándo se debe revisar. El resto de las
# vulnerabilidades críticas con parche siguen bloqueando el pipeline.
# =====================================================================
ignore:
  # CVE-2026-133325 (Tomcat, crítica). Afecta solo a clusters de Tomcat con
  # TLS 1.3 + clave precompartida (tráfico entre servidores Tomcat).
  # pokemon-service usa Tomcat embebido sin clustering: las réplicas no se
  # comunican entre sí (el balanceo lo hace Nginx).
  # La versión corregida (10.1.63) aún no está publicada en Maven Central.
  # REVISAR: subir tomcat.version a 10.1.63 cuando salga y borrar esta excepción.
  - vulnerability: CVE-2026-133325-tomcat-embed-core
    reason: "Solo afecta clustering TLS-PSK de Tomcat (no usado); parche 10.1.63 no publicado aún"
  - vulnerability: CVE-2026-133325
    reason: "Solo afecta clustering TLS-PSK de Tomcat (no usado); parche 10.1.63 no publicado aún"