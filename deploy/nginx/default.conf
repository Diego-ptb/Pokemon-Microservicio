# Gateway / balanceador de carga para las réplicas de pokemon-service.
# Se incluye dentro del bloque "http" de nginx.

# DNS interno de Docker: permite descubrir réplicas nuevas al escalar
# (docker compose up --scale app=N) sin reiniciar el gateway.
resolver 127.0.0.11 valid=10s ipv6=off;

# Limitación de tasa por IP: protege a la API de abusos / picos
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream pokemon_app {
    zone pokemon_app 64k;
    least_conn;
    # "resolve" re-consulta el DNS y agrega/quita réplicas automáticamente
    server app:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Evidencia de balanceo: indica qué réplica atendió la petición
    add_header X-Upstream-Addr $upstream_addr always;

    # Salud del propio gateway (para su healthcheck)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Solo se exponen health e info del actuator, no el resto
    location ~ ^/actuator/(health|info)(/.*)?$ {
        proxy_pass http://pokemon_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /actuator {
        return 404;
    }

    location / {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://pokemon_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Si una réplica falla, reintenta en otra (solo métodos idempotentes)
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
